name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels:
  - "type: bug"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, private data, or vulnerability details. Use SECURITY.md for security reports.
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe the defect and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, deterministic steps or a minimal repository.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Version or commit:
        - Operating system:
        - Runtime/toolchain:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and private data before pasting logs.
      render: shell
