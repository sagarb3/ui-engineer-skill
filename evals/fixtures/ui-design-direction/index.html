<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>
  <style>
    body { font-family: system-ui; background: #fff; color: #172554; padding: 24px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ccd2dc; }
    button { font: inherit; padding: 8px 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Inventory</h1>
    <button type="button">Add item</button>
    <table>
      <caption>Current stock</caption>
      <thead><tr><th>Item</th><th>Available</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>Oak shelf</td><td>2</td><td>Low stock</td></tr>
        <tr><td>Pine desk</td><td>18</td><td>Available</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
