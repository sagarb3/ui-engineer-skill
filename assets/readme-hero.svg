<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" fill="none" role="img" aria-labelledby="title description">
  <title id="title">UI Engineer Skills</title>
  <desc id="description">Shared engineering standards for React UI delivery. Design, build, and verify with a consistent operating model.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1440" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101C31"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#93A6C5" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1440" height="480" rx="16" fill="url(#surface)"/>
  <rect width="1440" height="480" rx="16" fill="url(#grid)"/>
  <rect x="64" y="65" width="10" height="28" rx="2" fill="#9AE8C0"/>
  <text x="90" y="87" fill="#B9C8DE" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">UI ENGINEER SKILLS</text>
  <text x="64" y="192" fill="#F4F7FC" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="700" letter-spacing="-2">Consistent UI.</text>
  <text x="64" y="273" fill="#F4F7FC" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="700" letter-spacing="-2">Reviewable delivery.</text>
  <text x="67" y="338" fill="#B9C8DE" font-family="Arial, Helvetica, sans-serif" font-size="26">Shared standards for React teams and their coding tools.</text>
  <path d="M67 391H752" stroke="#31415B"/>
  <text x="67" y="427" fill="#9AE8C0" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="2">REACT UI / ACCESSIBILITY / TESTING / GIT</text>
  <g transform="translate(1010 109)">
    <path d="M-62 36H0M-62 132H0M-62 228H0M-62 36V228" stroke="#344860" stroke-width="2"/>
    <rect width="332" height="72" rx="8" fill="#15253D" stroke="#344860"/>
    <rect y="96" width="332" height="72" rx="8" fill="#15253D" stroke="#344860"/>
    <rect y="192" width="332" height="72" rx="8" fill="#9AE8C0"/>
    <text x="28" y="46" fill="#E4EDF9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Design deliberately</text>
    <text x="28" y="142" fill="#E4EDF9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Build consistently</text>
    <text x="28" y="238" fill="#102B25" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Verify with evidence</text>
  </g>
